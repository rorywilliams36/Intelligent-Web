<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Plant Show</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/Montserrat.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <link rel="stylesheet" href="assets/css/bs-theme-overrides.css">
</head>

<body>
    <div class="card"><img class="card-img-top w-100 d-block" src="assets/img/plant_stock_img.jpeg">
        <div class="card-body">
            <h4 class="card-title">PlantName</h4>
            <div class="container">
                <div class="row">
                    <div class="col-md-6"><i class="far fa-clock"></i><span style="margin-left: 0.2em;">Date</span></div>
                    <div class="col"><i class="far fa-user"></i><span style="margin-left: 0.2em;">UserName</span></div>
                </div>
                <div class="row">
                    <div class="col-md-6"><i class="far fa-chart-bar"></i><span style="margin-left: 0.2em;">Size</span></div>
                    <div class="col-md-6"><i class="far fa-map"></i><span style="margin-left: 0.2em;">Location</span></div>
                </div>
            </div>
            <p class="card-text" style="margin-top: 1em;">Nullam id dolor id nibh ultricies vehicula ut id elit. Cras justo odio, dapibus ac facilisis in, egestas eget quam. Donec id elit non mi porta gravida at eget metus.</p>
            <div class="card">
                <div class="card-body" style="background: #f0ffee;">
                    <h4 class="card-title">Identification</h4>
                    <h6 class="text-muted card-subtitle mb-2">Status: Unknown</h6>
                    <p class="card-text">No information could be found for this plant.</p><a class="card-link" href="#">Link</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
